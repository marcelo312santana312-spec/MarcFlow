name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/marcelo312santana312-spec/marcflow:latest
            ghcr.io/marcelo312santana312-spec/marcflow:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=true
            NEXT_PUBLIC_APP_URL=https://marcflow.marctech.me
            NEXT_PUBLIC_API_URL=https://marcflow.marctech.me/api
            APP_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
